name: Markdown checks

on:
  push:
    paths:
      - '**.md'
      - '.github/workflows/markdown-check.yml'
  pull_request:
    paths:
      - '**.md'
      - '.github/workflows/markdown-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  markdown-check:
    name: Check Markdown files
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Verify README and list Markdown files
        run: |
          test -f README.md
          find . -name '*.md' -not -path './.git/*' -print
